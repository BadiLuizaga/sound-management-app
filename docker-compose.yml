# Sound Management — entorno de desarrollo (Fase 1).
#
# Las credenciales se leen del archivo .env (no versionado). No hay valores
# por defecto para contraseñas: si faltan, docker compose se detiene con un
# error en lugar de arrancar con claves triviales.
#
# Primer arranque:
#   cp .env.example .env            # completar DB_PASSWORD y DB_ROOT_PASSWORD
#   docker compose build
#   docker compose run --rm app composer install
#   docker compose run --rm app php artisan key:generate
#   docker compose up -d
#   docker compose exec app php artisan migrate     # manual, nunca automático
#
# Colas y tareas programadas (opcional):
#   docker compose --profile workers up -d

name: sound-management

x-app: &app
  build:
    context: .
    target: dev
  image: sound-management-app:dev
  working_dir: /var/www
  volumes:
    - .:/var/www
    # vendor vive en un volumen propio del contenedor (no se mezcla con el host)
    - vendor:/var/www/vendor
  environment:
    # Dentro de Docker la base está en el servicio "db"
    DB_HOST: db
    DB_PORT: 3306
    DB_REPORTS_HOST: db
    DB_REPORTS_PORT: 3306
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *app

  web:
    image: nginx:1.27-alpine
    ports:
      # Solo accesible desde la propia máquina
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90"]
    profiles: ["workers"]

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    profiles: ["workers"]

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sound_management_db}
      MYSQL_USER: ${DB_USERNAME:?Define DB_USERNAME en .env (no puede ser root)}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Igual que MySQL en Windows/XAMPP: nombres de tabla en minúsculas.
      # Evita fallos con tablas como NotaVenta/estadoRol al mover datos entre
      # entornos. Solo tiene efecto al crear el volumen por primera vez.
      - --lower-case-table-names=1
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - sound_management_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  vendor:
  # Volumen nuevo y propio: no reutiliza datos de la ferretería
  sound_management_mysql:
