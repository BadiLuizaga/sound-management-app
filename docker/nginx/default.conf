# Sound Management — Nginx delante de PHP-FPM (servicio "app")
server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    client_max_body_size 12M;
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        # La ruta del script es la del contenedor PHP (código montado en /var/www)
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # Ningún otro .php es ejecutable, y nunca archivos ocultos (.env, .git...)
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
